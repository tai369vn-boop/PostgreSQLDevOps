apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: insurance-db
  namespace: insurance-system
spec:
  instances: 4   # 1 primary tu dong bau + 2 replica

  bootstrap:
    initdb:
      database: pocdb
      owner: app_user

  storage:
    size: 1Gi
    storageClass: local-path   # kind dung storage class mac dinh "standard" (local-path-provisioner)

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # ============================================================
  # KHOI BACKUP - ap dung cho ca daily (volumeSnapshot) va
  # weekly (barmanObjectStore), khai bao chung o cap Cluster
  # ============================================================
  backup:
     # --- Cau hinh cho phuong thuc barmanObjectStore (dung cho Weekly) ---
    barmanObjectStore:
      destinationPath: "s3://insurance-db-backups/"
      endpointURL: "http://minio.minio.svc.cluster.local:9000"   # object storage noi bo
      s3Credentials:
        accessKeyId:
          name: backup-storage-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-storage-creds
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2

    # --- Retention policy: ap dung cho "recovery window" cua CA CUM ---
    retentionPolicy: "30d"
