apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: insurance-db
  namespace: insurance-system
spec:
  instances: 3   # 1 primary tu dong bau + 2 replica

  bootstrap:
    initdb:
      database: pocdb
      owner: app_user

  storage:
    size: 1Gi
    storageClass: local-path
    
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
      
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true            # plugin dam nhiem luu WAL len ObjectStore
      parameters:
        barmanObjectName: azurite-store   # ten ObjectStore o file 03       
