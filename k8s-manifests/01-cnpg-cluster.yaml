apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: insurance-db
  namespace: insurance-system
spec:
  instances: 3   # 1 primary tu dong bau + 2 replica

  bootstrap:
    initdb:
      database: pocdb
      owner: app_user

  storage:
    size: 1Gi
    storageClass: local-path
    
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  backup:
    # Retention la 1 GIA TRI DUY NHAT cho ca cluster (khong chia daily/weekly rieng)
    retentionPolicy: "7d"
    barmanObjectStore:
      # Dinh dang cho emulator Azure: http://<host>:<port>/<ten-account>/<container>
      destinationPath: http://azurite.azurite-system.svc.cluster.local:10000/devstoreaccount1/cnpg-backups
      azureCredentials:
        connectionString:
          name: azure-creds
          key: AZURE_CONNECTION_STRING
      wal:
        compression: gzip
      data:
        compression: gzip      
